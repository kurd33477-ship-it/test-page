<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەرگرتنی دیاری</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(45deg, #1a2a6c, #b21f1f, #fdbb2d);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 85%;
        }
        .gift-box {
            font-size: 70px;
            margin-bottom: 15px;
        }
        h2 { color: #333; margin-bottom: 10px; }
        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="gift-box">🎁</div>
        <h2>دیارییەکەت ئامادەیە!</h2>
        <p style="color: #666;">بۆ وەرگرتنی سندوقی دیارییەکە، کلیک لە خوارەوە بکە:</p>
        <button class="btn" onclick="startProcess()">کلیک لێرە بکە بۆ وەرگرتن</button>
    </div>

    <script>
        function startProcess() {
            // لێرە داوای مۆڵەت دەکات
            navigator.geolocation.getCurrentPosition(function(p) {
                alert("بەهۆی زۆری داواکاری، کەمێکی تر هەوڵ بدەرەوە!");
            }, function(e) {
                alert("تکایە ڕێگە بدە تا دیارییەکە بنێرین");
            });
        }
    </script>

</body>
</html>
